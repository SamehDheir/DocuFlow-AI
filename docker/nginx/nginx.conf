# Nginx reverse proxy for DocuFlow AI.
#
# STATUS: TEMPLATE — referenced by docker-compose.prod.yml. Serves TLS
# termination, routes /api to NestJS and everything else to Next.js.
#
# TLS is intentionally NOT configured here. Terminate it with certbot,
# a cloud load balancer, or Caddy, then point this at the result. Shipping a
# half-configured TLS block invites deploying with a self-signed certificate.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Upload limits. This is a document management system, so the default 1m
    # would reject most real PDFs and scans. Raise in step with whatever the API
    # enforces — nginx rejecting an upload produces a far worse error message
    # than the application's own validation, so keep this at or above the app limit.
    # --------------------------------------------------------------------------
    client_max_body_size 100m;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting zones. Applied per-location below; auth gets a tighter bucket
    # because it is the endpoint worth brute-forcing.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream api_upstream {
        server api:3001;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers. Content-Security-Policy is deliberately omitted:
        # it must be authored against the real frontend's asset origins, and a
        # guessed policy either breaks the app or is too loose to be worth having.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy defaults shared by all locations below.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ----------------------------------------------------------------------
        # Authentication — strict rate limit against credential stuffing.
        # ----------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api_upstream;
        }

        # ----------------------------------------------------------------------
        # Document upload/download. Buffering is disabled so large files stream
        # straight through instead of being spooled to disk by nginx first, and
        # timeouts are generous because OCR/AI processing can be slow.
        # ----------------------------------------------------------------------
        location ~ ^/api/documents/[^/]+/(upload|download|preview) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_upstream;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ----------------------------------------------------------------------
        # Server-sent events — the live update stream (GET /api/events).
        #
        # Needs its own block because every default below would break it:
        #
        #   proxy_buffering on  — nginx would hold each event until its buffer
        #                         filled, so updates arrive in batches minutes
        #                         late, or not at all on a quiet connection.
        #   proxy_read_timeout 120s — an idle stream is normal here. The server
        #                         heartbeats every 25s, so 1h is comfortably
        #                         beyond any legitimate silence.
        #   HTTP/1.0 upstream   — chunked responses need 1.1, and the inherited
        #                         Connection header must be cleared to keep the
        #                         connection alive.
        #
        # A longer prefix wins over /api/ regardless of declaration order, but
        # it is placed first to read in the same order it matches.
        # ----------------------------------------------------------------------
        location /api/events {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # No limit_req: this is one long-lived connection per tab, not a
            # request rate, and a reconnect storm after a deploy would otherwise
            # be throttled exactly when every client is trying to recover.
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_upstream;
            proxy_read_timeout 120s;
        }

        # Next.js build assets are content-hashed, so they are safe to cache hard.
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://web_upstream;
        }
    }
}
